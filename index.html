<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VendaSocial V10.2 — Corrigido</title>
<style>
:root{--bg:#0a1020;--panel:#131d33;--panel2:#1c2945;--text:#eef3ff;--muted:#a2afca;--line:#2b3958;--blue:#718cff;--green:#39d6a0;--red:#ff7284;--yellow:#ffd166}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 13px;background:var(--blue);color:white;font-weight:700}button.secondary{background:var(--panel2);border:1px solid var(--line)}button.danger{background:#6b2938}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:#0c1528;color:var(--text)}label{display:block;color:var(--muted);font-size:13px;margin:9px 0 5px}.app{display:grid;grid-template-columns:225px 1fr;min-height:100vh}.side{padding:20px 13px;background:#10182a;border-right:1px solid var(--line)}.brand{font-size:22px;font-weight:900;letter-spacing:-.8px;margin:3px 10px 20px}.brand span{color:var(--blue)}.nav{display:grid;gap:5px}.nav button{background:transparent;color:var(--muted);text-align:left;font-weight:650}.nav button.active,.nav button:hover{background:var(--panel2);color:white}.side-note{font-size:12px;color:var(--muted);line-height:1.5;margin:24px 10px}.main{padding:24px;max-width:1500px;width:100%;margin:auto;min-width:0}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}.eyebrow{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1.3px}.top h1{margin:4px 0;font-size:27px}.actions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px;min-width:0}.metric .label{color:var(--muted);font-size:13px}.metric .value{font-size:26px;font-weight:850;margin:8px 0}.metric .hint{font-size:12px;color:var(--muted)}.section{margin-top:16px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}.section-head h2{font-size:17px;margin:0}.two{display:grid;grid-template-columns:1.2fr 1fr;gap:13px}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-weight:650}.pill{display:inline-block;border-radius:20px;padding:4px 8px;font-size:11px;background:#26334f;color:#d2dcf7}.pill.good{background:#163f37;color:#72e7bd}.pill.warn{background:#4a3c1d;color:#ffe09a}.pill.bad{background:#4b2631;color:#ffabb7}.recommendation{padding:12px 0;border-bottom:1px solid var(--line)}.recommendation:last-child{border:0}.recommendation strong{display:block;margin-bottom:4px}.recommendation p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}.recommendation .tag{font-size:11px;color:var(--yellow);margin-bottom:4px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.full{grid-column:1/-1}.form-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.empty{color:var(--muted);padding:20px 0;text-align:center}.notice{padding:12px 14px;border-radius:10px;background:#172541;border:1px solid #2c4168;color:#cdd9ff;font-size:13px;line-height:1.5}.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.dot{height:8px;width:8px;border-radius:50%;background:var(--green);display:inline-block}.hidden{display:none!important}.toast{position:fixed;right:16px;bottom:16px;background:#203151;border:1px solid #3b5280;padding:13px 16px;border-radius:12px;box-shadow:0 12px 30px #0006;max-width:90vw;z-index:5}.chart{height:160px;display:flex;align-items:end;gap:8px;padding:12px 4px 0}.bar{flex:1;min-width:10px;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,#8098ff,#4c66d6);position:relative}.bar span{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted)}.chart-legend{color:var(--muted);font-size:12px;margin-top:25px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.toolbar>*{flex:1;min-width:140px}.small{font-size:12px;color:var(--muted)}.kpi-line{display:flex;gap:16px;flex-wrap:wrap}.kpi-line span{font-size:13px;color:var(--muted)}.kpi-line b{color:var(--text)}.progress{height:7px;background:#273450;border-radius:10px;overflow:hidden;margin-top:9px}.progress i{display:block;height:100%;background:var(--green)}.actions-cell{display:flex;gap:5px}.actions-cell button{padding:6px 8px;font-size:12px}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{padding:11px;border-right:0;border-bottom:1px solid var(--line)}.brand{margin:5px 6px 10px}.nav{display:flex;overflow-x:auto;max-width:100%;scrollbar-width:thin}.nav button{white-space:nowrap}.side-note{display:none}.main{padding:15px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}}
@media(max-width:460px){.grid{gap:8px}.card{padding:12px}.metric .value{font-size:21px}.top h1{font-size:23px}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.toolbar>*{min-width:100%}}
</style></head>
<body><div class="app">
<aside class="side"><div class="brand">Venda<span>Social</span> <small style="font-size:11px;color:#9eaccb">V10</small></div><nav class="nav" id="nav">
<button class="active" data-page="dashboard">▦ Dashboard</button><button data-page="campaigns">◉ Campanhas</button><button data-page="products">▣ Produtos</button><button data-page="leads">♙ Leads</button><button data-page="sales">R$ Vendas</button><button data-page="reports">▤ Relatórios</button><button data-page="connections">↗ Conexões</button><button data-page="settings">⚙ Regras</button></nav><div class="side-note">V10 · Gestão de vendas, campanhas, contatos e relatórios. Integrações reais exigem configuração oficial das plataformas.</div></aside>
<main class="main"><div class="top"><div><div class="eyebrow">Central de operação · V10.2 corrigida</div><h1 id="pageTitle">Dashboard</h1><div class="status"><span class="dot" id="apiDot"></span><span id="apiStatus">Conectando ao servidor…</span></div></div><div class="actions"><button class="secondary" id="refreshBtn">↻ Atualizar</button><button id="quickAdd">＋ Adicionar</button></div></div><div id="page"></div></main></div><div id="toast" class="toast hidden"></div>
<script>
const DEFAULT_API='https://vendasocialv200-render.onrender.com';
const API=(localStorage.getItem('vendasocial_api')||DEFAULT_API).trim().replace(/\/+$/,'');
const state={page:'dashboard',data:{products:[],campaigns:[],leads:[],sales:[],dashboard:{}},settings:{minRoas:2,minSpend:50,noConversionSpend:30},search:'',channel:'Todos',errors:[],integrations:null,loading:false};
const $=s=>document.querySelector(s), money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n)||0), num=n=>new Intl.NumberFormat('pt-BR').format(Number(n)||0);
function toast(m){$('#toast').textContent=m;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),2600)}
async function api(p,o={}){if(!API||!/^https:\/\//i.test(API))throw Error('Configure uma URL HTTPS válida em Conexões.');const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),18000);try{const headers={'Content-Type':'application/json',...(sessionStorage.getItem('vendasocial_key')?{'X-Admin-Key':sessionStorage.getItem('vendasocial_key')}:{})};const r=await fetch(API+p,{...o,headers:{...headers,...(o.headers||{})},signal:controller.signal,cache:'no-store'});let d;try{d=await r.json()}catch{throw Error('Resposta inválida do servidor (HTTP '+r.status+').')}if(!r.ok)throw Error((r.status===401||r.status===403)?'Acesso negado: confira a chave ADMIN_API_KEY em Conexões':(d.error||'Falha na API (HTTP '+r.status+')'));return d}catch(e){if(e.name==='AbortError')throw Error('Tempo de conexão esgotado. O Render pode estar iniciando.');if(e instanceof TypeError)throw Error('Falha de rede ou CORS. Verifique o Render e ALLOWED_ORIGIN.');throw e}finally{clearTimeout(timeout)}}
async function load(){if(state.loading)return;state.loading=true;$('#apiStatus').textContent='Atualizando dados…';const endpoints=[['dashboard','/api/dashboard'],['products','/api/products'],['campaigns','/api/campaigns'],['leads','/api/leads'],['sales','/api/sales'],['settings','/api/settings']];const results=await Promise.allSettled(endpoints.map(([,url])=>api(url)));const errors=[];results.forEach((result,i)=>{const [key]=endpoints[i];if(result.status==='fulfilled'){if(key==='settings')state.settings={...state.settings,...result.value};else if(key==='dashboard')state.data.dashboard=result.value.dashboard||result.value;else state.data[key]=Array.isArray(result.value)?result.value:[];}else errors.push(key+': '+(result.reason?.message||'erro desconhecido'))});state.errors=errors;state.loading=false;$('#apiStatus').textContent=errors.length?('Carregamento parcial: '+errors.length+' seção(ões) com erro'):'Servidor conectado · dados atualizados';$('#apiDot').style.background=errors.length?'var(--yellow)':'var(--green)';render();if(errors.length)showErrors();}
function showErrors(){const p=$('#page');if(!p||!state.errors.length)return;const box=document.createElement('div');box.className='notice';box.setAttribute('role','alert');box.style.marginBottom='14px';box.innerHTML='<strong>Algumas informações não foram carregadas.</strong><p class="small" style="margin-bottom:0">'+state.errors.map(esc).join('<br>')+'</p>';p.prepend(box)}
function setPage(p){state.page=p;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();showErrors()}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function metric(l,v,h=''){return `<div class="card metric"><div class="label">${l}</div><div class="value">${v}</div><div class="hint">${h}</div></div>`}
function table(h,rows){return `<div class="table-wrap"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${h.length}" class="empty">Nenhum registro cadastrado.</td></tr>`}</tbody></table></div>`}
function pill(s){let c=/ativa|ganho|pago|convertido|registrada/i.test(s)?'good':/pausada|novo|pendente|rascunho/i.test(s)?'warn':'bad';return `<span class="pill ${c}">${esc(s||'—')}</span>`}
function dash(){let d=state.data.dashboard||{},cs=state.data.campaigns||[],rs=d.recommendations||[],values=Array.isArray(d.weeklySales)?d.weeklySales:[],max=Math.max(1,...values.map(v=>Number(v)||0)),bars=values.map((v,i)=>`<div class="bar" style="height:${Math.max(3,(Number(v)||0)/max*120)}px"><span>${['S','T','Q','Q','S','S','D'][i]||''}</span></div>`).join('');return `<div class="grid">${metric('Vendas registradas',num(d.totalSales),'Registros de venda')}${metric('Receita total',money(d.revenue),'Vendas registradas (sem duplicação)')}${metric('Investimento',money(d.adSpend),'Campanhas cadastradas')}${metric('ROAS geral',(Number(d.roas)||0).toFixed(2)+'x','Receita atribuída ÷ investimento')}</div><div class="two section"><div class="card"><div class="section-head"><h2>Visão semanal</h2><span class="pill">Resumo</span></div>${values.length?`<div class="chart">${bars}</div><div class="chart-legend">Vendas registradas nos últimos 7 dias.</div>`:'<div class="empty">Ainda não há dados semanais disponíveis.</div>'}</div><div class="card"><div class="section-head"><h2>Recomendações V10</h2><span class="pill">${rs.length} alertas</span></div>${rs.map(r=>`<div class="recommendation"><div class="tag">${esc(r.priority)}</div><strong>${esc(r.title)}</strong><p>${esc(r.message)}</p></div>`).join('')||'<div class="empty">Nenhuma recomendação disponível.</div>'}</div></div><div class="card section"><div class="section-head"><h2>Campanhas recentes</h2><button class="secondary" onclick="setPage('campaigns')">Ver todas</button></div>${table(['Campanha','Canal','Investimento','Receita','ROAS','Status'],cs.slice(-5).reverse().map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.channel)}</td><td>${money(c.spend)}</td><td>${money(c.revenue)}</td><td>${(Number(c.roas)||0).toFixed(2)}x</td><td>${pill(c.status)}</td></tr>`).join(''))}</div>`}
function campaignPage(){let a=state.data.campaigns||[];return `<div class="two"><div class="card"><h2 style="margin-top:0">Cadastrar campanha</h2><form id="campaignForm"><div class="form-grid"><div class="full"><label>Nome *</label><input name="name" required maxlength="160" placeholder="Ex.: Promoção de primavera"></div><div><label>Canal</label><select name="channel"><option>Facebook</option><option>Instagram</option><option>TikTok</option><option>Outro</option></select></div><div><label>Status</label><select name="status"><option>Ativa</option><option>Pausada</option><option>Rascunho</option></select></div><div><label>Investimento (R$)</label><input name="spend" type="number" min="0" step=".01" value="0"></div><div><label>Receita atribuída (R$)</label><input name="revenue" type="number" min="0" step=".01" value="0"></div><div><label>Cliques</label><input name="clicks" type="number" min="0" value="0"></div><div><label>Conversões</label><input name="conversions" type="number" min="0" value="0"></div></div><div class="form-actions"><button>Salvar campanha</button></div></form></div><div class="card"><h2 style="margin-top:0">Indicadores</h2><div class="recommendation"><strong>ROAS</strong><p>Receita atribuída ÷ investimento. Compare com a meta e com a margem do produto.</p></div><div class="recommendation"><strong>CTR e conversão</strong><p>Cliques ajudam a analisar interesse; conversões ajudam a avaliar o resultado. Cadastre números reais.</p></div><div class="notice">A ferramenta sugere ações, mas não altera nem pausa anúncios automaticamente.</div></div></div><div class="card section"><div class="section-head"><h2>Campanhas cadastradas</h2><span class="pill">${a.length} registros</span></div><div class="toolbar"><input id="campaignSearch" placeholder="Buscar campanha..." value="${esc(state.search)}"><select id="campaignChannel"><option>Todos</option>${['Facebook','Instagram','TikTok','Outro'].map(x=>`<option ${state.channel===x?'selected':''}>${x}</option>`).join('')}</select></div><div id="campaignTable">${campaignRows(a)}</div></div>`}
function campaignRows(a){let filtered=a.filter(c=>(!state.search||String(c.name).toLowerCase().includes(state.search.toLowerCase()))&&(state.channel==='Todos'||c.channel===state.channel));return table(['Campanha','Canal','Gasto','Receita','Cliques','Conversões','ROAS','Status','Ações'],filtered.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.channel)}</td><td>${money(c.spend)}</td><td>${money(c.revenue)}</td><td>${num(c.clicks)}</td><td>${num(c.conversions)}</td><td>${(+c.roas||0).toFixed(2)}x</td><td>${pill(c.status)}</td><td><div class="actions-cell"><button class="secondary" onclick="editCampaign('${esc(c.id)}')">Editar</button><button class="danger" onclick="del('campaigns','${esc(c.id)}')">Excluir</button></div></td></tr>`).join(''))}
function safeUrl(u){try{const x=new URL(String(u||''));return ['https:','http:'].includes(x.protocol)?x.href:''}catch{return ''}}
function generic(type){let cfg={products:{title:'Produtos',fields:[['name','Nome','text'],['price','Preço (R$)','number'],['stock','Estoque','number'],['buyUrl','Link direto de compra','url']],heads:['Produto','Preço','Estoque','Compra']},leads:{title:'Leads',fields:[['name','Nome','text'],['contact','Contato','text'],['source','Origem','text'],['status','Status','text']],heads:['Nome','Contato','Origem','Status']},sales:{title:'Vendas',fields:[['product','Produto','text'],['amount','Valor (R$)','number'],['customer','Cliente','text'],['status','Status','text']],heads:['Produto','Valor','Cliente','Status']}}[type],a=state.data[type]||[];return `<div class="two"><div class="card"><h2 style="margin-top:0">Novo registro</h2><form id="${type}Form"><div class="form-grid">${cfg.fields.map(([n,l,t])=>`<div><label>${l}</label><input name="${n}" type="${t}" ${t==='number'?'min="0" step=".01"':''} ${t==='url'?'placeholder="https://loja.com/produto"':''} ${n==='name'||n==='product'?'required':''}></div>`).join('')}</div><div class="form-actions"><button>Salvar</button></div></form></div><div class="card"><h2 style="margin-top:0">${cfg.title}</h2><div class="metric"><div class="label">Registros atuais</div><div class="value">${a.length}</div><div class="hint">Atualizados pelo backend</div></div><div class="notice">Use Relatórios para exportar os registros em CSV.</div></div></div><div class="card section"><div class="section-head"><h2>${cfg.title} cadastrados</h2><span class="pill">${a.length}</span></div>${table([...cfg.heads,'Ações'],a.map(o=>`<tr>${cfg.fields.map(([n])=>`<td>${n==='buyUrl'?(safeUrl(o[n])?`<a href="${esc(safeUrl(o[n]))}" target="_blank" rel="noopener noreferrer" style="color:var(--green)">Comprar ↗</a>`:'—'):['price','amount'].includes(n)?money(o[n]):esc(o[n]??'—')}</td>`).join('')}<td><div class="actions-cell"><button class="secondary" onclick="editRecord('${type}','${esc(o.id)}')">Editar</button><button class="danger" onclick="del('${type}','${esc(o.id)}')">Excluir</button></div></td></tr>`).join(''))}</div>`}
function reports(){let d=state.data.dashboard||{},cs=state.data.campaigns||[],products=state.data.products||[],leads=state.data.leads||[],sales=state.data.sales||[];return `<div class="grid">${metric('Campanhas',cs.length,'Cadastradas')}${metric('Produtos',products.length,'Cadastrados')}${metric('Leads',leads.length,'Contatos')}${metric('Vendas',sales.length,'Registros')}</div><div class="card section"><h2 style="margin-top:0">Exportar relatórios</h2><p class="small">Baixe cópias CSV dos registros cadastrados para abrir em planilhas. Os arquivos contêm apenas os dados existentes no VendaSocial.</p><div class="form-actions">${[['campaigns','Campanhas CSV'],['products','Produtos CSV'],['leads','Leads CSV'],['sales','Vendas CSV']].map(([k,l])=>`<button class="secondary" onclick="exportCsv('${k}')">↓ ${l}</button>`).join('')}<button onclick="exportSummary()">↓ Resumo geral CSV</button><button class="secondary" onclick="exportBackup()">↓ Backup JSON</button></div></div><div class="card section"><h2 style="margin-top:0">Resumo de desempenho</h2><div class="kpi-line"><span>Receita total: <b>${money(d.revenue)}</b></span><span>Investimento: <b>${money(d.adSpend)}</b></span><span>ROAS: <b>${(+d.roas||0).toFixed(2)}x</b></span></div><div class="notice" style="margin-top:15px">A precisão depende dos dados que você registrou. Sem conexão oficial com as plataformas, esses relatórios não representam sincronização automática dos anúncios.</div></div>`}
function connections(){const platforms=[['Facebook','https://www.facebook.com/','facebook'],['Instagram','https://www.instagram.com/','instagram'],['TikTok','https://www.tiktok.com/','tiktok']];return `<div class="grid">${platforms.map(([name,home,key])=>`<div class="card"><h2>${name}</h2><p class="small">Abra a rede social e salve o link público do seu perfil.</p><label>Link do seu perfil</label><input type="url" id="social_${key}" value="${esc(localStorage.getItem('vs_profile_'+key)||'')}" placeholder="${home}"><div class="form-actions"><button type="button" onclick="saveSocial('${key}')">Salvar link</button><button type="button" class="secondary" onclick="openSocial('${key}','${home}')">Abrir ${name}</button></div><p class="small">Link de perfil não autoriza publicação automática nem consulta de anúncios.</p></div>`).join('')}</div><div class="card section"><h2>Compartilhar produtos</h2><p>Em Produtos, cadastre o link direto da página de compra. Depois copie o link e divulgue nas suas redes sociais. O cliente será direcionado à loja original.</p><button type="button" onclick="setPage('products')">Cadastrar produto</button></div><div class="card section"><h2>Conexão com o servidor</h2><form id="apiForm"><label>URL do Render</label><input name="api" value="${esc(API)}" required><label>Chave de acesso do painel</label><input type="password" name="key" autocomplete="off" placeholder="${sessionStorage.getItem('vendasocial_key')?'Chave já informada':'Informe a chave do Render'}"><div class="form-actions"><button>Salvar conexão</button><button type="button" class="secondary" onclick="testApi()">Testar servidor</button><button type="button" class="secondary" onclick="testAccess()">Testar acesso</button></div></form><div class="notice">Para conectar contas e publicar anúncios diretamente, Facebook/Instagram e TikTok exigem autorização oficial (OAuth). Não é seguro nem possível substituir essa autorização por um link de perfil.</div></div>`}
function saveSocial(key){const u=document.querySelector('#social_'+key)?.value.trim()||'';if(u&&!safeUrl(u))return toast('Informe um link válido começando com https://');localStorage.setItem('vs_profile_'+key,u);toast('Link do perfil salvo neste navegador')}
function openSocial(key,home){const u=localStorage.getItem('vs_profile_'+key)||home;window.open(safeUrl(u)||home,'_blank','noopener,noreferrer')}
function settings(){return `<div class="card" style="max-width:700px"><h2 style="margin-top:0">Regras de otimização</h2><form id="settingsForm"><label>ROAS mínimo desejado</label><input name="minRoas" type="number" min="0" step=".1" value="${state.settings.minRoas}"><label>Gasto mínimo para avaliar (R$)</label><input name="minSpend" type="number" min="0" step="1" value="${state.settings.minSpend}"><label>Alertar gasto sem conversão a partir de (R$)</label><input name="noConversionSpend" type="number" min="0" step="1" value="${state.settings.noConversionSpend}"><div class="form-actions"><button>Salvar regras</button></div></form><div class="notice" style="margin-top:16px">As regras criam alertas. Não alteram campanhas reais.</div></div>`}
function render(){let titles={dashboard:'Dashboard',campaigns:'Campanhas',products:'Produtos',leads:'Leads',sales:'Vendas',reports:'Relatórios',connections:'Conexões',settings:'Regras de otimização'};$('#pageTitle').textContent=titles[state.page];let views={dashboard:dash,campaigns:campaignPage,products:()=>generic('products'),leads:()=>generic('leads'),sales:()=>generic('sales'),reports,connections,settings};$('#page').innerHTML=views[state.page]();wire();if(state.errors.length)showErrors();if(state.page==='campaigns'){const s=$('#campaignSearch'),c=$('#campaignChannel');s.oninput=()=>{state.search=s.value;$('#campaignTable').innerHTML=campaignRows(state.data.campaigns||[])};c.onchange=()=>{state.channel=c.value;$('#campaignTable').innerHTML=campaignRows(state.data.campaigns||[])};}}
function wire(){let cf=$('#campaignForm');if(cf)cf.onsubmit=async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(cf));['spend','revenue','clicks','conversions'].forEach(k=>o[k]=Number(o[k]||0));try{await api('/api/campaigns',{method:'POST',body:JSON.stringify(o)});toast('Campanha salva');state.search='';await load()}catch(e){toast(e.message)}};for(let t of ['products','leads','sales']){let f=$('#'+t+'Form');if(f)f.onsubmit=async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(f));for(let k of Object.keys(o))if(['price','stock','amount'].includes(k))o[k]=Number(o[k]||0);try{await api('/api/'+t,{method:'POST',body:JSON.stringify(o)});toast('Registro salvo');await load()}catch(e){toast(e.message)}}}let af=$('#apiForm');if(af)af.onsubmit=e=>{e.preventDefault();localStorage.setItem('vendasocial_api',new FormData(af).get('api').trim().replace(/\/$/,''));let k=new FormData(af).get('key');if(k)sessionStorage.setItem('vendasocial_key',k);location.reload()};let sf=$('#settingsForm');if(sf)sf.onsubmit=async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(sf));Object.keys(o).forEach(k=>o[k]=Number(o[k]));try{state.settings=await api('/api/settings',{method:'PUT',body:JSON.stringify(o)});toast('Regras salvas');await load()}catch(e){toast(e.message)}}}
async function del(t,id){if(!confirm('Excluir este registro?'))return;try{await api('/api/'+t+'/'+id,{method:'DELETE'});toast('Registro excluído');await load()}catch(e){toast(e.message)}}
async function editRecord(type,id){const o=(state.data[type]||[]).find(x=>x.id===id);if(!o)return;const fields={products:['name','price','stock','buyUrl'],leads:['name','contact','source','status'],sales:['product','amount','customer','status']}[type];if(!fields)return;let changed={};for(const field of fields){let value=prompt('Editar '+field+':',o[field]??'');if(value===null)return;changed[field]=['price','stock','amount'].includes(field)?Number(value):value;}try{await api('/api/'+type+'/'+id,{method:'PUT',body:JSON.stringify(changed)});toast('Registro atualizado');await load()}catch(e){toast(e.message)}}
async function editCampaign(id){let c=(state.data.campaigns||[]).find(x=>x.id===id);if(!c)return;let name=prompt('Nome da campanha:',c.name);if(name===null)return;let spend=prompt('Investimento (R$):',c.spend);if(spend===null)return;let revenue=prompt('Receita atribuída (R$):',c.revenue);if(revenue===null)return;let clicks=prompt('Cliques:',c.clicks);if(clicks===null)return;let conversions=prompt('Conversões:',c.conversions);if(conversions===null)return;let status=prompt('Status:',c.status);if(status===null)return;try{await api('/api/campaigns/'+id,{method:'PUT',body:JSON.stringify({name,spend:Number(spend),revenue:Number(revenue),clicks:Number(clicks),conversions:Number(conversions),status,channel:c.channel})});toast('Campanha atualizada');await load()}catch(e){toast(e.message)}}
function download(name,text,type='text/csv;charset=utf-8;'){let blob=new Blob([type.startsWith('text/csv')?'\ufeff'+text:text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function exportCsv(type){let a=state.data[type]||[];if(!a.length){toast('Não há registros para exportar');return}let keys=[...new Set(a.flatMap(o=>Object.keys(o)))],cell=v=>'"'+String(v??'').replace(/^[=+@\-\t\r]/,m=>'\''+m).replace(/"/g,'""')+'"';download('vendasocial_'+type+'.csv',[keys.map(cell).join(';'),...a.map(o=>keys.map(k=>cell(o[k])).join(';'))].join('\r\n'))}
function exportSummary(){let d=state.data.dashboard||{},rows=[['Indicador','Valor'],['Vendas registradas',d.totalSales||0],['Receita total',d.revenue||0],['Investimento',d.adSpend||0],['ROAS',d.roas||0]];download('vendasocial_resumo.csv',rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n'))}
function exportBackup(){download('vendasocial_backup.json',JSON.stringify({exportedAt:new Date().toISOString(),data:state.data,settings:state.settings},null,2),'application/json')}
async function testApi(){try{const r=await fetch(API+'/health',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const h=await r.json();toast('Servidor online: '+h.service+' V'+h.version+'. Para acessar dados, informe a chave do painel.')}catch(e){toast('Falha no teste do servidor: '+e.message)}}
async function testAccess(){try{await api('/api/settings');toast('Acesso aos dados autorizado.')}catch(e){toast('Falha no acesso: '+e.message)}}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)setPage(b.dataset.page)});$('#refreshBtn').onclick=load;$('#quickAdd').onclick=()=>{if(state.page==='dashboard')setPage('campaigns');else{let f=$('#page form');if(f)f.querySelector('input')?.focus();else toast('Escolha uma seção para adicionar.')}};load();
</script></body></html>
